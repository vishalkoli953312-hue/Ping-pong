<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Model Viewer (Mobile Friendly)</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; background-color: #121212; font-family: sans-serif; }
        
        /* 3D कैनवास */
        canvas { display: block; width: 100vw; height: 100vh; }

        /* ऊपर लिंक डालने का UI पैनल */
        #ui-panel {
            position: absolute;
            top: 10px;
            left: 5%;
            width: 90%;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        #model-url {
            flex: 1;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        #load-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        #load-btn:active { background: #0056b3; }

        /* लोड हो रहा है संदेश */
        #loading {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #00ffcc;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- लिंक डालने के लिए UI -->
    <div id="ui-panel">
        <input type="text" id="model-url" value="https://github.com/vishalkoli953312-hue/Ping-pong/releases/download/Ping_pong/dbfz_island_stage.glb" placeholder="यहाँ .glb मॉडल का URL डालें">
        <button id="load-btn">ओपन करें</button>
    </div>

    <div id="loading">मॉडल लोड हो रहा है...</div>

    <!-- Three.js और आवश्यक लोडर फ़ाइलें -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Three.js सीन, कैमरा और रेंडरर सेटअप
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e24);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 2. टच/माउस से मॉडल को घुमाने के लिए OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. लाइटिंग (मॉडल को साफ़ दिखाने के लिए)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight1.position.set(10, 20, 10);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight2.position.set(-10, -10, -10);
        scene.add(dirLight2);

        // 4. GLTF लोडर फ़ंक्शन
        const loader = new THREE.GLTFLoader();
        let currentModel = null;

        function load3DModel(url) {
            const loadingTag = document.getElementById('loading');
            loadingTag.style.display = 'block';
            loadingTag.innerText = 'मॉडल लोड हो रहा है...';

            // पुराना मॉडल हटाएं अगर कोई लोड है
            if (currentModel) {
                scene.remove(currentModel);
            }

            loader.load(
                url,
                function (gltf) {
                    currentModel = gltf.scene;
                    scene.add(currentModel);

                    // मॉडल के आकार के हिसाब से कैमरे को ऑटो-एडजस्ट करना
                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.5;

                    camera.position.set(center.x, center.y + (maxDim * 0.2), cameraZ);
                    controls.target.copy(center);
                    controls.update();

                    loadingTag.style.display = 'none';
                },
                function (xhr) {
                    if (xhr.lengthComputable) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingTag.innerText = `लोड हो रहा है: ${percent}%`;
                    }
                },
                function (error) {
                    console.error('त्रुटि:', error);
                    loadingTag.innerText = 'मॉडल लोड करने में विफल! URL जांचें।';
                }
            );
        }

        // बटन क्लिक करने पर लोड करें
        document.getElementById('load-btn').addEventListener('click', () => {
            const url = document.getElementById('model-url').value.trim();
            if (url) load3DModel(url);
        });

        // पेज लोड होते ही डिफ़ॉल्ट लिंक लोड करें
        load3DModel(document.getElementById('model-url').value);

        // 5. एनीमेशन लूप
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // स्क्रीन साइज़ एडजस्टमेंट (मोबाइल रोटेशन के लिए)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
